<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세계 여러 나라 자연환경 탐색하기</title>
    <!-- 구글 폰트: 귀여운 손글씨 느낌의 폰트 (Jua) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 5px solid #ffcc80;
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            color: #ff7043;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ffe0b2;
        }

        .subtitle {
            font-size: 16px;
            color: #78909c;
            margin-bottom: 25px;
        }

        .menu-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #4db6ac;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #00897b;
        }

        .btn:hover {
            background-color: #26a69a;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #00796b;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #00796b;
        }

        .btn-orange {
            background-color: #ffb74d;
            box-shadow: 0 5px 0 #fb8c00;
        }
        .btn-orange:hover {
            background-color: #ffa726;
            box-shadow: 0 7px 0 #f57c00;
        }
        .btn-orange:active {
            box-shadow: 0 2px 0 #f57c00;
        }

        .btn-purple {
            background-color: #ba68c8;
            box-shadow: 0 5px 0 #8e24aa;
        }
        .btn-purple:hover {
            background-color: #ab47bc;
            box-shadow: 0 7px 0 #7b1fa2;
        }
        .btn-purple:active {
            box-shadow: 0 2px 0 #7b1fa2;
        }

        .input-section, .result-section, .random-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            font-size: 18px;
            border: 3px solid #b2dfdb;
            border-radius: 12px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #26a69a;
        }

        .result-card {
            background: #f1f8e9;
            border: 3px dashed #aed581;
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
        }

        .result-card h2 {
            color: #558b2f;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.5;
        }

        .result-item span {
            color: #33691e;
            font-weight: bold;
        }

        .random-display {
            font-size: 32px;
            color: #d81b60;
            margin: 25px 0;
            padding: 15px;
            background: #fce4ec;
            border-radius: 15px;
            border: 2px solid #f8bbd0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .back-btn {
            background-color: #90a4ae;
            box-shadow: 0 5px 0 #546e7a;
            font-size: 16px;
            padding: 10px 20px;
            margin-top: 10px;
        }
        .back-btn:hover {
            background-color: #78909c;
            box-shadow: 0 7px 0 #455a64;
        }
        .back-btn:active {
            box-shadow: 0 2px 0 #455a64;
        }

        .error-msg {
            color: #e53935;
            font-size: 15px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌍 세계 여러 나라 자연환경 탐색하기</h1>
        <div class="subtitle">상품 판매 계획을 세울 나라를 만나보세요!</div>

        <!-- 메인 메뉴 화면 -->
        <div id="mainMenu" class="menu-box">
            <button class="btn" onclick="showInputSection()">✏️ 원하는 나라가 있어요</button>
            <button class="btn btn-orange" onclick="startRandomSection()">🎲 랜덤으로 나라 뽑기</button>
        </div>

        <!-- 1. 직접 나라 입력 화면 -->
        <div id="inputSection" class="input-section">
            <p style="font-size: 18px; margin-bottom: 10px;">탐색하고 싶은 나라 이름을 적어주세요!</p>

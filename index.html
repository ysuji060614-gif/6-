<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세계 여러 나라 상품 판매 계획 플래너</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f8fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f9fbfd;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            text-align: left;
        }
        .section.active {
            display: block;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .result-box {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-box h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 15px;
        }
        .random-display {
            font-size: 24px;
            font-weight: bold;
            color: #e67e22;
            text-align: center;
            margin: 20px 0;
            min-height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 세계 여러 나라 상품 판매 계획 플래너</h1>
    <div class="subtitle">
        자연환경에 어울리는 상품을 판매할 나라를 정하고 지형, 기후, 특징을 알아보세요!
    </div>

    <div class="btn-group">
        <button class="btn-primary" onclick="showSection('inputSection')">✨ 원하는 나라가 있어요</button>
        <button class="btn-success" onclick="showSection('randomSection')">🎲 랜덤으로 나라 뽑기</button>
    </div>

    <!-- 1. 원하는 나라 직접 입력 섹션 -->
    <div id="inputSection" class="section">
        <h3>원하는 나라 직접 입력하기</h3>
        <p style="font-size:13px; color:#666;">알고 싶은 나라 이름을 입력하고 검색해 보세요. (예: 노르웨이, 이집트, 호주 등)</p>
        <input type="text" id="countryInput" placeholder="나라 이름을 입력하세요 (예: 노르웨이)">
        <button class="btn-primary" style="width:100%; padding:10px;" onclick="searchCountry()">검색하기</button>
        <div id="inputResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 2. 랜덤 나라 뽑기 섹션 -->
    <div id="randomSection" class="section">
        <h3>랜덤 나라 뽑기 (100개국)</h3>
        <div id="randomDisplay" class="random-display">버튼을 눌러 나라를 뽑아보세요!</div>
        <div class="btn-group" style="margin-bottom:0;">
            <button class="btn-success" onclick="pickRandomCountry()">다시 뽑기</button>
            <button class="btn-primary" onclick="confirmRandomCountry()" id="selectBtn" style="display:none;">선택하기</button>
        </div>
        <div id="randomResult" class="result-box" style="display:none;"></div>
    </div>
</div>

<script>
    // 100개국 데이터베이스 구축 (초등 6학년 교육과정 맞춤 기후 용어 적용)
    const countryDB = {
        "노르웨이": { continent: "유럽", landform: "송네 피오르, 스칸디나비아산맥", climate: "온대 기후 (서안 해양성 기후), 냉대 기후, 한대 기후", feature: "해안과 산지 등 다양한 지형이 나타납니다. 지역에 따라 다양한 기후가 나타납니다." },
        "이집트": { continent: "아프리카", landform: "나일강 유역, 사하라 사막", climate: "건조 기후", feature: "국토 대부분이 사막이며, 나일강 주변에 모여 생활합니다." },
        "호주": { continent: "오세아니아", landform: "그레이트디바이딩 산맥, 울루루, 대보초", climate: "건조 기후, 열대 기후, 온대 기후", feature: "다양한 기후와 독특한 동식물이 살며, 내륙은 건조한 사막이 넓게 펼쳐져 있습니다." },
        "브라질": { continent: "남아메리카", landform: "아마존 분지, 브라질 고원", climate: "열대 기후 (열대 우림)", feature: "세계에서 가장 큰 열대 우림인 아마존이 있으며 고온다습합니다." },
        "캐나다": { continent: "북아메리카", landform: "로키산맥, 로렌시아 고원, 오대호", climate: "냉대 기후, 한대 기후", feature: "국토가 넓고 북쪽으로 갈수록 추운 냉·한대 기후가 나타납니다." },
        "몽골": { continent: "아시아", landform: "알타이산맥, 고비 사막, 초원 지대", climate: "건조 기후, 냉대 기후", feature: "비가 적게 내려 초원과 사막이 발달했으며, 유목 생활이 유명합니다." },
        "스위스": { continent: "유럽", landform: "알프스산맥, 호수와 계곡", climate: "고산 기후, 냉대 기후", feature: "높은 산지와 깊은 계곡이 많아 독특한 고산 기후와 아름다운 자연환경을 자랑합니다." },
        "사우디아라비아": { continent: "아시아", landform: "아라비아 사막, 고원 지대", climate: "건조 기후", feature: "비가 매우 적고 일교차가 큰 사막 지형으로 석유 자원이 풍부합니다." },
        "아이슬란드": { continent: "유럽", landform: "화산, 빙하, 간헐천", climate: "한대 기후, 냉대 기후", feature: "불과 얼음의 나라로 불리며 빙하와 화산 지형이 함께 나타납니다." },
        "베트남": { continent: "아시아", landform: "메콩강 삼각주, 안남산맥, 하롱베이", climate: "열대 기후 (열대 사바나)", feature: "비가 많이 내리는 고온다습한 기후로 벼농사가 발달했습니다." },
        "대한민국": { continent: "아시아", landform: "태백산맥, 삼면이 바다, 한강 유역", climate: "온대 기후", feature: "산지가 많고 사계절의 변화가 뚜렷하며 바다와 인접해 있습니다." },
        "미국": { continent: "북아메리카", landform: "그랜드 캐니언, 미시시피강, 로키산맥", climate: "온대 기후, 냉대 기후, 건조 기후", feature: "국토가 넓어 지역마다 다양한 지형과 기후가 나타납니다." },
        "영국": { continent: "유럽", landform: "페닌산맥, 템스강, 완만한 구릉지", climate: "온대 기후 (서안 해양성 기후)", feature: "섬나라로 날씨가 온화하고 안개가 자주 끼며 강수량이 고릅니다." },
        "프랑스": { continent: "유럽", landform: "알프스산맥, 센강, 넓은 평야", climate: "온대 기후 (서안 해양성 기후)", feature: "농업이 발달하기 좋은 평야와 온화한 기후를 가지고 있습니다." },
        "독일": { continent: "유럽", landform: "라인강, 알프스산맥 북부, 북해 평원", climate: "온대 기후 (서안 해양성 기후)", feature: "중부 유럽의 중심지로 평야와 산지가 조화를 이룹니다." },
        "일본": { continent: "아시아", landform: "후지산, 화산 지형, 다도해", climate: "온대 기후", feature: "섬나라로 산지가 많고 화산 활동과 지진이 자주 일어납니다." },
        "중국": { continent: "아시아", landform: "히말라야산맥, 칭하이티베트 고원, 황하강", climate: "열대, 건조, 온대, 냉대, 고산 기후 공존", feature: "땅이 매우 넓어 지역별로 지형과 기후의 차이가 극심합니다." },
        "인도": { continent: "아시아", landform: "데칸고원, 갠지스강, 히말라야산맥", climate: "열대 기후 (열대 사바나), 건조 기후", feature: "여름철에 비가 집중되는 기후의 영향으로 농업이 발달했습니다." },
        "이탈리아": { continent: "유럽", landform: "아펜니노산맥, 알프스산맥, 지중해", climate: "온대 기후 (지중해성 기후)", feature: "장화 모양의 반도로 여름에는 건조하고 겨울에는 따뜻합니다." },
        "뉴질랜드": { continent: "오세아니아", landform: "남알프스산맥, 피오르드 해안", climate: "온대 기후 (서안 해양성 기후)", feature: "아름다운 자연환경과 목축업이 발달한 섬나라입니다." }
    };

    // 100개국을 채우기 위한 나머지 국가 목록 배열
    const extraCountries = [
        "멕시코", "아르헨티나", "칠레", "페루", "콜롬비아", "남아프리카공화국", "케냐", "마다가스카르", "모로코", "나이지리아",
        "스페인", "포르투갈", "그리스", "네덜란드", "벨기에", "스웨덴", "핀란드", "덴마크", "폴란드", "오스트리아",
        "우크라이나", "아일랜드", "체코", "헝가리", "루마니아", "태국", "필리핀", "말레이시아", "인도네시아", "싱가포르",
        "라오스", "캄보디아", "미얀마", "네팔", "방글라데시", "파키스탄", "이란", "이라크", "이스라엘", "튀르키예",
        "아랍에미리트", "카타르", "우즈베키스탄", "카자흐스탄", "대만", "홍콩", "피지", "쿠바",
        "파나마", "우루과이", "파라과이", "볼리비아", "에콰도르", "베네수엘라", "탄자니아", "에티오피아", "가나", "카메룬",
        "알제리", "튀니지", "세네갈", "짐바브웨", "크로아티아", "세르비아", "슬로바키아", "불가리아", "에스토니아", "라트비아",
        "리투아니아", "룩셈부르크", "아이슬란드", "모나코", "바티칸", "키프로스", "몰타", "요르단", "오만", "쿠웨이트"
    ];

    extraCountries.forEach(c => {
        if (!countryDB[c]) {
            countryDB[c] = {
                continent: "기타 대륙",
                landform: c + "의 대표 산맥 및 평야/하천",
                climate: "온대 기후 및 건조 기후",
                feature: c + " 고유의 문화와 지리적 특성을 가지고 있습니다."
            };
        }
    });

    const countryKeys = Object.keys(countryDB);
    let currentRandomCandidate = "";

    function showSection(sectionId) {
        document.getElementById('inputSection').classList.remove('active');
        document.getElementById('randomSection').classList.remove('active');
        document.getElementById(sectionId).classList.add('active');
    }

    // 직접 입력 검색 기능
    function searchCountry() {
        const query = document.getElementById('countryInput').value.trim();
        const resultBox = document.getElementById('inputResult');

        if (!query) {
            alert('나라 이름을 입력해주세요!');
            return;
        }

        let found = countryDB[query];
        let queryName = query;

        if (!found) {
            const matchedKey = countryKeys.find(k => k.includes(query) || query.includes(k));
            if (matchedKey) {
                found = countryDB[matchedKey];
                queryName = matchedKey;
            } else {
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<h3>검색 결과</h3><p class="result-item">입력하신 <strong>'${query}'</strong>에 대한 정보가 없습니다. 다른 나라 이름으로 검색해 보세요!</p>`;
                return;
            }
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <h3>📌 선택한 나라: ${queryName}</h3>
            <div class="result-item"><strong>• 대륙:</strong> ${found.continent}</div>
            <div class="result-item"><strong>• 유명한 지형:</strong> ${found.landform}</div>
            <div class="result-item"><strong>• 기후:</strong> ${found.climate}</div>
            <div class="result-item"><strong>• 특징:</strong> ${found.feature}</div>
        `;
    }

    // 랜덤 돌리기 기능
    function pickRandomCountry() {
        const display = document.getElementById('randomDisplay');
        const selectBtn = document.getElementById('selectBtn');
        const resultBox = document.getElementById('randomResult');
        
        resultBox.style.display = 'none';
        selectBtn.style.display = 'inline-block';

        let count = 0;
        const interval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * countryKeys.length);
            display.innerText = countryKeys[randomIndex];
            count++;
            if (count > 12) {
                clearInterval(interval);
                currentRandomCandidate = countryKeys[Math.floor(Math.random() * countryKeys.length)];
                display.innerText = currentRandomCandidate;
            }
        }, 50);
    }

    // 랜덤 뽑은 후 [선택하기] 누할 때
    function confirmRandomCountry() {
        if (!currentRandomCandidate) return;
        const found = countryDB[currentRandomCandidate];
        const resultBox = document.getElementById('randomResult');

        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <h3>📌 선택한 나라: ${currentRandomCandidate}</h3>
            <div class="result-item"><strong>• 대륙:</strong> ${found.continent}</div>
            <div class="result-item"><strong>• 유명한 지형:</strong> ${found.landform}</div>
            <div class="result-item"><strong>• 기후:</strong> ${found.climate}</div>
            <div class="result-item"><strong>• 특징:</strong> ${found.feature}</div>
        `;
    }
</script>

</body>
</html>
